<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration - SPROUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#D8F3DC]">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row">

            <!-- Left branded panel -->
            <div class="md:w-1/2 text-white p-10 flex flex-col justify-between relative" style="background-image: linear-gradient(rgba(27,67,50,0.85), rgba(27,67,50,0.85)), url('/images/image1.jpg'); background-size: cover; background-position: center;">
                <div>
                    <span class="text-3xl font-extrabold tracking-wide">SPROUT</span>
                    <p class="text-sm text-[#D8F3DC] mt-1">Sugarcane PROduction Utilization and Technology</p>
                </div>
                <div class="mt-10">
                    <h2 class="text-2xl font-bold mb-2">Farmer Access</h2>
                    <p class="text-sm text-[#D8F3DC] leading-relaxed">Register to book cane pickups, track deliveries, and stay updated on your crop status.</p>
                </div>
                <a href="/" class="text-sm text-[#95D5B2] hover:text-white mt-10 inline-block">&larr; Back to Home</a>
            </div>

            <!-- Right form panel -->
            <div class="md:w-1/2 p-10 flex flex-col justify-center">
                <div class="text-center mb-6">
                    <div class="w-14 h-14 mx-auto rounded-full bg-[#D8F3DC] flex items-center justify-center text-2xl mb-3">🌾</div>
                    <h2 class="text-2xl font-bold text-[#1B4332]">Farmer Registration</h2>
                    <p class="text-sm text-gray-500">Your Farmer ID will be generated automatically after signup.</p>
                </div>

                <form method="post" action="/farmerRegister">
                    <div th:if="${error}" class="bg-red-100 text-red-700 text-sm rounded px-3 py-2 mb-4" th:text="${error}"></div>

                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-semibold mb-2" for="name">Full Name</label>
                        <input class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-[#1B4332] focus:border-transparent" id="name" name="name" type="text" placeholder="Your full name" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-semibold mb-2" for="email">Email</label>
                        <input class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-[#1B4332] focus:border-transparent" id="email" name="email" type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-semibold mb-2" for="phone">Phone Number</label>
                        <input class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-[#1B4332] focus:border-transparent" id="phone" name="phone" type="tel" placeholder="Your phone number">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-semibold mb-2" for="fieldOfCane">Field of Cane (acres)</label>
                        <input class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-[#1B4332] focus:border-transparent" id="fieldOfCane" name="fieldOfCane" type="number" step="0.01" min="0" placeholder="e.g. 2.5">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-semibold mb-2" for="location">Location</label>
                        <input class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-[#1B4332] focus:border-transparent" id="location" name="location" type="text" placeholder="Your location">
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-semibold mb-2" for="password">Password</label>
                        <input class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-[#1B4332] focus:border-transparent" id="password" name="password" type="password" placeholder="Choose a password" required>
                    </div>
                    <button type="submit" class="w-full bg-[#1B4332] hover:bg-[#2d6a4f] text-white font-bold py-3 rounded-lg transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1B4332]">Register</button>
                </form>

                <p class="text-sm text-center text-gray-500 mt-6">Already registered? <a href="/farmerLogin" class="text-[#1B4332] hover:underline font-semibold">Log in here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
