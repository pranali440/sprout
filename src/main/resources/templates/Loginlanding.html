<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SPROUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div th:include="fragments/navbar :: navbar"></div>

    <div class="container mx-auto py-16 px-4">
        <h1 class="text-3xl font-bold text-center mb-2">Log In to SPROUT</h1>
        <p class="text-center text-gray-600 mb-10">Choose how you'd like to log in</p>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-5xl mx-auto">
            <a href="/farmerLogin" class="bg-white rounded-lg shadow-md hover:shadow-xl transition p-6 text-center">
                <div class="text-4xl mb-3">🌾</div>
                <h2 class="text-lg font-bold mb-1">Farmer</h2>
                <p class="text-sm text-gray-500">Log in with your Farmer ID</p>
            </a>
            <a href="/workerLogin" class="bg-white rounded-lg shadow-md hover:shadow-xl transition p-6 text-center">
                <div class="text-4xl mb-3">👷</div>
                <h2 class="text-lg font-bold mb-1">Worker</h2>
                <p class="text-sm text-gray-500">Log in with your email</p>
            </a>
            <a href="/admin/adminlogin" class="bg-white rounded-lg shadow-md hover:shadow-xl transition p-6 text-center">
                <div class="text-4xl mb-3">🔑</div>
                <h2 class="text-lg font-bold mb-1">Admin</h2>
                <p class="text-sm text-gray-500">Root admin login</p>
            </a>
            <a href="/deptlogin" class="bg-white rounded-lg shadow-md hover:shadow-xl transition p-6 text-center">
                <div class="text-4xl mb-3">🏭</div>
                <h2 class="text-lg font-bold mb-1">Department Admin</h2>
                <p class="text-sm text-gray-500">Log in to your department</p>
            </a>
        </div>

        <p class="text-center text-gray-600 mt-10">New here? <a href="/register" class="text-green-700 font-semibold hover:underline">Create an account</a></p>
    </div>

    <div th:include="fragments/footer :: footer"></div>
</body>
</html>
