<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event - SPROUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#D8F3DC] min-h-screen">
    <header class="bg-[#1B4332] text-white py-6 shadow-md">
        <div class="container mx-auto flex items-center justify-between px-4">
            <div>
                <span class="text-2xl font-extrabold tracking-wide">SPROUT</span>
                <h1 class="text-lg font-semibold text-[#D8F3DC] mt-1">Add Event</h1>
            </div>
            <a href="/admin/admindash" class="text-sm text-[#95D5B2] hover:text-white font-semibold">&larr; Back to Dashboard</a>
        </div>
    </header>

    <main class="container mx-auto py-10 px-4">
        <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-8">
            <div class="text-center mb-6">
                <div class="w-14 h-14 mx-auto rounded-full bg-[#D8F3DC] flex items-center justify-center text-2xl mb-3">📅</div>
                <h2 class="text-2xl font-bold text-[#1B4332]">New Event</h2>
                <p class="text-sm text-gray-500">Publish an upcoming event for everyone to see</p>
            </div>

            <form action="/events/add" method="post">
                <div class="mb-4">
                    <label for="title" class="block text-gray-700 text-sm font-semibold mb-2">Title</label>
                    <input type="text" id="title" name="title" class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-[#1B4332] focus:border-transparent" placeholder="e.g. Annual Harvest Festival" required>
                </div>
                <div class="mb-6">
                    <label for="description" class="block text-gray-700 text-sm font-semibold mb-2">Description</label>
                    <textarea id="description" name="description" rows="4" class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-[#1B4332] focus:border-transparent" placeholder="Describe the event" required></textarea>
                </div>
                <button type="submit" class="w-full bg-[#1B4332] hover:bg-[#2d6a4f] text-white font-bold py-3 rounded-lg transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1B4332]">Publish Event</button>
            </form>
        </div>
    </main>

    <footer class="text-center text-sm text-[#1B4332] py-6">
        &copy; 2026 SPROUT. All rights reserved.
    </footer>
</body>
</html>
