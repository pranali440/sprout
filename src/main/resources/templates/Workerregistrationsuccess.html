<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Success</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="flex justify-center items-center min-h-screen">
        <div class="bg-white shadow-md rounded px-8 py-8 mb-4 w-full max-w-md text-center">
            <div class="text-green-600 text-5xl mb-4">&#10003;</div>
            <h2 class="text-2xl font-bold mb-2">Registration Successful!</h2>
            <p class="text-gray-600 mb-4">Thank you for registering with SPROUT.</p>
            <div class="bg-green-50 border border-green-200 rounded p-4 mb-6">
                <p class="text-sm text-gray-600">Your Worker ID:</p>
                <p class="text-3xl font-bold text-green-700" th:text="${workerId}"></p>
            </div>
            <p class="text-sm text-gray-500 mb-4">You'll log in using your email and password.</p>
            <a href="/workerLogin" class="inline-block bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded">Go to Login</a>
        </div>
    </div>
</body>
</html>
