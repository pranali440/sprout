<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Department Dashboard - SPROUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#D8F3DC] min-h-screen">
    <header class="bg-[#1B4332] text-white py-8 shadow-md">
        <div class="container mx-auto text-center px-4">
            <span class="text-2xl font-extrabold tracking-wide">SPROUT</span>
            <h1 class="text-2xl font-bold mt-2">Billing Department</h1>
            <div class="text-sm text-[#D8F3DC] mt-1">
                <span id="current-date"></span> | <span id="current-time"></span>
            </div>
        </div>
    </header>

    <main class="container mx-auto py-10 px-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <a th:href="@{/todays-bookings/fetch/{bookingDate}(bookingDate=${#dates.format(#dates.createNow(),'yyyy-MM-dd')})}" class="bg-white rounded-2xl shadow-md hover:shadow-xl p-8 flex flex-col items-center text-center transition duration-300">
                <div class="w-16 h-16 rounded-full bg-[#D8F3DC] flex items-center justify-center text-3xl mb-4">🧾</div>
                <h2 class="text-lg font-semibold text-[#1B4332]">Farmer Bill</h2>
                <p class="text-xs text-gray-500 mt-1">View and manage farmer bills</p>
            </a>
            <a href="daily-cane-scheduling.html" class="bg-white rounded-2xl shadow-md hover:shadow-xl p-8 flex flex-col items-center text-center transition duration-300">
                <div class="w-16 h-16 rounded-full bg-[#D8F3DC] flex items-center justify-center text-3xl mb-4">💰</div>
                <h2 class="text-lg font-semibold text-[#1B4332]">Salary Slip</h2>
                <p class="text-xs text-gray-500 mt-1">Generate worker salary slips</p>
            </a>
            <a href="cane-weighing.html" class="bg-white rounded-2xl shadow-md hover:shadow-xl p-8 flex flex-col items-center text-center transition duration-300">
                <div class="w-16 h-16 rounded-full bg-[#D8F3DC] flex items-center justify-center text-3xl mb-4">⚖️</div>
                <h2 class="text-lg font-semibold text-[#1B4332]">Cane Weighing</h2>
                <p class="text-xs text-gray-500 mt-1">Today's weighing records</p>
            </a>
            <a href="/department/pendingWorkers" class="bg-white rounded-2xl shadow-md hover:shadow-xl p-8 flex flex-col items-center text-center transition duration-300">
                <div class="w-16 h-16 rounded-full bg-[#D8F3DC] flex items-center justify-center text-3xl mb-4">⏳</div>
                <h2 class="text-lg font-semibold text-[#1B4332]">Pending Worker Approvals</h2>
                <p class="text-xs text-gray-500 mt-1">Review and approve signups</p>
            </a>
        </div>
    </main>

    <footer class="text-center text-sm text-[#1B4332] py-8">
        &copy; 2026 SPROUT. All rights reserved.
    </footer>

    <script>
        function getCurrentDateTime() {
            const currentDate = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const currentTime = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true });
            document.getElementById('current-date').textContent = currentDate;
            document.getElementById('current-time').textContent = currentTime;
        }
        setInterval(getCurrentDateTime, 1000);
        getCurrentDateTime();
    </script>
</body>
</html>
