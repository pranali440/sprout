<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Sugar Factory Data - SPROUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#D8F3DC] min-h-screen">
    <!-- Header -->
    <header class="bg-[#1B4332] text-white py-6 shadow-md">
        <div class="container mx-auto flex items-center justify-between px-4">
            <div>
                <span class="text-2xl font-extrabold tracking-wide">SPROUT</span>
                <h1 class="text-lg font-semibold text-[#D8F3DC] mt-1">Add Sugar Factory Data</h1>
            </div>
            <a href="/admin/admindash" class="text-sm text-[#95D5B2] hover:text-white font-semibold">&larr; Back to Dashboard</a>
        </div>
    </header>

    <main class="container mx-auto py-10 px-4">
        <form action="/admin/add_data" method="post" class="max-w-5xl mx-auto space-y-6">

            <!-- Section: Membership -->
            <div class="bg-white rounded-2xl shadow-md p-8">
                <h2 class="text-lg font-bold text-[#1B4332] mb-5 pb-2 border-b border-[#D8F3DC]">👥 Membership</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label for="season" class="block text-gray-700 text-sm font-semibold mb-1.5">Season</label>
                        <input type="text" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="season" name="season">
                    </div>
                    <div>
                        <label for="totalProducerMembers" class="block text-gray-700 text-sm font-semibold mb-1.5">Total Producer Members</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="totalProducerMembers" name="totalProducerMembers">
                    </div>
                    <div>
                        <label for="producerMembersSC" class="block text-gray-700 text-sm font-semibold mb-1.5">Producer Members SC</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="producerMembersSC" name="producerMembersSC">
                    </div>
                    <div>
                        <label for="producerMembersST" class="block text-gray-700 text-sm font-semibold mb-1.5">Producer Members ST</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="producerMembersST" name="producerMembersST">
                    </div>
                    <div>
                        <label for="totalNonProducerMembers" class="block text-gray-700 text-sm font-semibold mb-1.5">Total Non-Producer Members</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="totalNonProducerMembers" name="totalNonProducerMembers">
                    </div>
                    <div>
                        <label for="nonProducerMembersSC" class="block text-gray-700 text-sm font-semibold mb-1.5">Non-Producer Members SC</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="nonProducerMembersSC" name="nonProducerMembersSC">
                    </div>
                    <div>
                        <label for="nonProducerMembersST" class="block text-gray-700 text-sm font-semibold mb-1.5">Non-Producer Members ST</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="nonProducerMembersST" name="nonProducerMembersST">
                    </div>
                    <div>
                        <label for="totalMembers" class="block text-gray-700 text-sm font-semibold mb-1.5">Total Members</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="totalMembers" name="totalMembers">
                    </div>
                    <div>
                        <label for="nominatedMembers" class="block text-gray-700 text-sm font-semibold mb-1.5">Nominated Members</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="nominatedMembers" name="nominatedMembers">
                    </div>
                </div>
            </div>

            <!-- Section: Area of Operation & Villages -->
            <div class="bg-white rounded-2xl shadow-md p-8">
                <h2 class="text-lg font-bold text-[#1B4332] mb-5 pb-2 border-b border-[#D8F3DC]">🗺️ Area of Operation &amp; Villages</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label for="areaOfOperationKarvirTaluka" class="block text-gray-700 text-sm font-semibold mb-1.5">Area of Operation - Karvir Taluka</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="areaOfOperationKarvirTaluka" name="areaOfOperationKarvirTaluka">
                    </div>
                    <div>
                        <label for="areaOfOperationRadhanagariTaluka" class="block text-gray-700 text-sm font-semibold mb-1.5">Area of Operation - Radhanagari Taluka</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="areaOfOperationRadhanagariTaluka" name="areaOfOperationRadhanagariTaluka">
                    </div>
                    <div>
                        <label for="villagesWithinArea" class="block text-gray-700 text-sm font-semibold mb-1.5">Villages Within Area</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="villagesWithinArea" name="villagesWithinArea">
                    </div>
                    <div>
                        <label for="villagesOutsideMaharashtra" class="block text-gray-700 text-sm font-semibold mb-1.5">Villages Outside Maharashtra</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="villagesOutsideMaharashtra" name="villagesOutsideMaharashtra">
                    </div>
                    <div>
                        <label for="villagesOutsideAreaMaharashtra" class="block text-gray-700 text-sm font-semibold mb-1.5">Villages Outside Area (Maharashtra)</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="villagesOutsideAreaMaharashtra" name="villagesOutsideAreaMaharashtra">
                    </div>
                    <div>
                        <label for="totalVillages" class="block text-gray-700 text-sm font-semibold mb-1.5">Total Villages</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="totalVillages" name="totalVillages">
                    </div>
                </div>
            </div>

            <!-- Section: Crushing Capacity & Season -->
            <div class="bg-white rounded-2xl shadow-md p-8">
                <h2 class="text-lg font-bold text-[#1B4332] mb-5 pb-2 border-b border-[#D8F3DC]">⚙️ Crushing Capacity &amp; Season</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label for="sanctionedCaneCrushingCapacity" class="block text-gray-700 text-sm font-semibold mb-1.5">Sanctioned Cane Crushing Capacity</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="sanctionedCaneCrushingCapacity" name="sanctionedCaneCrushingCapacity">
                    </div>
                    <div>
                        <label for="installedCaneCrushingCapacity" class="block text-gray-700 text-sm font-semibold mb-1.5">Installed Cane Crushing Capacity</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="installedCaneCrushingCapacity" name="installedCaneCrushingCapacity">
                    </div>
                    <div>
                        <label for="caneCrushingSeasonStartDate" class="block text-gray-700 text-sm font-semibold mb-1.5">Cane Crushing Season Start Date</label>
                        <input type="date" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="caneCrushingSeasonStartDate" name="caneCrushingSeasonStartDate">
                    </div>
                    <div>
                        <label for="caneCrushingSeasonEndDate" class="block text-gray-700 text-sm font-semibold mb-1.5">Cane Crushing Season End Date</label>
                        <input type="date" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="caneCrushingSeasonEndDate" name="caneCrushingSeasonEndDate">
                    </div>
                </div>
            </div>

            <!-- Section: Area Breakdown -->
            <div class="bg-white rounded-2xl shadow-md p-8">
                <h2 class="text-lg font-bold text-[#1B4332] mb-5 pb-2 border-b border-[#D8F3DC]">📐 Area Breakdown</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label for="areaWithinZone" class="block text-gray-700 text-sm font-semibold mb-1.5">Area Within Zone</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="areaWithinZone" name="areaWithinZone">
                    </div>
                    <div>
                        <label for="areaOutsideZone" class="block text-gray-700 text-sm font-semibold mb-1.5">Area Outside Zone</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="areaOutsideZone" name="areaOutsideZone">
                    </div>
                    <div>
                        <label for="areaMaharashtraGovernment" class="block text-gray-700 text-sm font-semibold mb-1.5">Area - Maharashtra Government</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="areaMaharashtraGovernment" name="areaMaharashtraGovernment">
                    </div>
                    <div>
                        <label for="areaOutsideMaharashtra" class="block text-gray-700 text-sm font-semibold mb-1.5">Area Outside Maharashtra</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="areaOutsideMaharashtra" name="areaOutsideMaharashtra">
                    </div>
                    <div>
                        <label for="totalArea" class="block text-gray-700 text-sm font-semibold mb-1.5">Total Area</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="totalArea" name="totalArea">
                    </div>
                </div>
            </div>

            <!-- Section: Production & Recovery -->
            <div class="bg-white rounded-2xl shadow-md p-8">
                <h2 class="text-lg font-bold text-[#1B4332] mb-5 pb-2 border-b border-[#D8F3DC]">🏭 Production &amp; Recovery</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label for="producedSugar" class="block text-gray-700 text-sm font-semibold mb-1.5">Produced Sugar</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="producedSugar" name="producedSugar">
                    </div>
                    <div>
                        <label for="rawSugar" class="block text-gray-700 text-sm font-semibold mb-1.5">Raw Sugar</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="rawSugar" name="rawSugar">
                    </div>
                    <div>
                        <label for="averageSugarRecoveryPercentage" class="block text-gray-700 text-sm font-semibold mb-1.5">Average Sugar Recovery %</label>
                        <input type="number" step="0.01" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="averageSugarRecoveryPercentage" name="averageSugarRecoveryPercentage">
                    </div>
                    <div>
                        <label for="molassesProduced" class="block text-gray-700 text-sm font-semibold mb-1.5">Molasses Produced</label>
                        <input type="number" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="molassesProduced" name="molassesProduced">
                    </div>
                    <div>
                        <label for="molassesProducedAveragePerCaneInTons" class="block text-gray-700 text-sm font-semibold mb-1.5">Molasses Produced Avg. Per Cane (Tons)</label>
                        <input type="number" step="0.01" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="molassesProducedAveragePerCaneInTons" name="molassesProducedAveragePerCaneInTons">
                    </div>
                    <div>
                        <label for="caneRecoveryRate" class="block text-gray-700 text-sm font-semibold mb-1.5">Cane Recovery Rate</label>
                        <input type="number" step="0.01" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="caneRecoveryRate" name="caneRecoveryRate">
                    </div>
                    <div>
                        <label for="bagassePercentageAverage" class="block text-gray-700 text-sm font-semibold mb-1.5">Bagasse Percentage Average</label>
                        <input type="number" step="0.01" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="bagassePercentageAverage" name="bagassePercentageAverage">
                    </div>
                </div>
            </div>

            <!-- Section: Cane Crushed Breakdown -->
            <div class="bg-white rounded-2xl shadow-md p-8">
                <h2 class="text-lg font-bold text-[#1B4332] mb-5 pb-2 border-b border-[#D8F3DC]">🌾 Cane Crushed Breakdown</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label for="caneCrushedMemberWithinFactoryArea" class="block text-gray-700 text-sm font-semibold mb-1.5">Cane Crushed - Member Within Factory Area</label>
                        <input type="number" step="0.01" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="caneCrushedMemberWithinFactoryArea" name="caneCrushedMemberWithinFactoryArea">
                    </div>
                    <div>
                        <label for="caneCrushedNonMemberWithinFactoryArea" class="block text-gray-700 text-sm font-semibold mb-1.5">Cane Crushed - Non-Member Within Factory Area</label>
                        <input type="number" step="0.01" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="caneCrushedNonMemberWithinFactoryArea" name="caneCrushedNonMemberWithinFactoryArea">
                    </div>
                    <div>
                        <label for="caneCrushedOtherAreaInState" class="block text-gray-700 text-sm font-semibold mb-1.5">Cane Crushed - Other Area In State</label>
                        <input type="number" step="0.01" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="caneCrushedOtherAreaInState" name="caneCrushedOtherAreaInState">
                    </div>
                    <div>
                        <label for="caneCrushedOutsideState" class="block text-gray-700 text-sm font-semibold mb-1.5">Cane Crushed - Outside State</label>
                        <input type="number" step="0.01" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="caneCrushedOutsideState" name="caneCrushedOutsideState">
                    </div>
                    <div>
                        <label for="totalCaneCrushedArea" class="block text-gray-700 text-sm font-semibold mb-1.5">Total Cane Crushed Area</label>
                        <input type="number" step="0.01" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="totalCaneCrushedArea" name="totalCaneCrushedArea">
                    </div>
                    <div>
                        <label for="caneCrushedWithinFactoryArea" class="block text-gray-700 text-sm font-semibold mb-1.5">Cane Crushed Within Factory Area</label>
                        <input type="number" step="0.01" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="caneCrushedWithinFactoryArea" name="caneCrushedWithinFactoryArea">
                    </div>
                    <div>
                        <label for="caneUsedForJaggery" class="block text-gray-700 text-sm font-semibold mb-1.5">Cane Used For Jaggery</label>
                        <input type="number" step="0.01" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="caneUsedForJaggery" name="caneUsedForJaggery">
                    </div>
                    <div>
                        <label for="caneUsedForSeeds" class="block text-gray-700 text-sm font-semibold mb-1.5">Cane Used For Seeds</label>
                        <input type="number" step="0.01" class="w-full border border-gray-300 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]" id="caneUsedForSeeds" name="caneUsedForSeeds">
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-[#1B4332] hover:bg-[#2d6a4f] text-white font-bold py-3.5 rounded-lg transition text-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1B4332]">Submit Sugar Factory Data</button>
        </form>
    </main>

    <footer class="text-center text-sm text-[#1B4332] py-8">
        &copy; 2026 SPROUT. All rights reserved.
    </footer>
</body>
</html>
