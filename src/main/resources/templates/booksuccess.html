<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Success - SPROUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#D8F3DC] min-h-screen">
    <div class="min-h-screen flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl overflow-hidden">

            <!-- Header -->
            <div class="bg-[#1B4332] px-8 py-6 text-white text-center">
                <div class="w-14 h-14 mx-auto rounded-full bg-[#D8F3DC] flex items-center justify-center text-3xl mb-3">✅</div>
                <h2 class="text-2xl font-bold">Your Cane Has Been Booked!</h2>
                <p class="text-sm text-[#D8F3DC] mt-1">Thanks for booking with SPROUT</p>
            </div>

            <div class="p-8">
                <div class="bg-[#D8F3DC] rounded-lg px-4 py-4 mb-6 space-y-3">
                    <div class="flex justify-between items-center" th:if="${farmerName}">
                        <span class="text-xs text-gray-600">Booked by</span>
                        <span class="text-sm font-semibold text-[#1B4332]" th:text="${farmerName}"></span>
                    </div>
                    <div class="flex justify-between items-center" th:if="${location}">
                        <span class="text-xs text-gray-600">Pickup Location</span>
                        <span class="text-sm font-semibold text-[#1B4332]" th:text="${location}"></span>
                    </div>
                    <div class="flex justify-between items-center" th:if="${bookingDate}">
                        <span class="text-xs text-gray-600">Booking Date</span>
                        <span class="text-sm font-semibold text-[#1B4332]" th:text="${bookingDate}"></span>
                    </div>
                    <div class="flex justify-between items-center" th:if="${bookingTime}">
                        <span class="text-xs text-gray-600">Booking Time</span>
                        <span class="text-sm font-semibold text-[#1B4332]" th:text="${bookingTime}"></span>
                    </div>
                </div>

                <p class="text-sm text-gray-500 mb-6 text-center">We've received your pickup request and it will show up in today's schedule.</p>

                <a href="/farmerportaldash" class="inline-block w-full text-center bg-[#1B4332] hover:bg-[#2d6a4f] text-white font-bold py-3 rounded-lg transition">Back to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
