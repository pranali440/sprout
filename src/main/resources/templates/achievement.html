<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements - SPROUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#D8F3DC] min-h-screen">
    <!-- Header -->
    <header class="bg-[#1B4332] text-white py-10 shadow-md">
        <div class="container mx-auto text-center px-4">
            <span class="text-2xl font-extrabold tracking-wide">SPROUT</span>
            <h1 class="text-3xl font-bold mt-3">Our Achievements</h1>
            <p class="text-sm text-[#D8F3DC] mt-2">Milestones from across the SPROUT sugar factory</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto py-12 px-4">

        <div th:if="${#lists.isEmpty(achievements)}" class="text-center py-16 text-[#1B4332]">
            <p class="text-lg font-semibold">No achievements have been added yet.</p>
        </div>

        <div th:unless="${#lists.isEmpty(achievements)}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="achievement : ${achievements}" class="bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition duration-300">
                <div class="w-full h-48 bg-[#D8F3DC] flex items-center justify-center overflow-hidden">
                    <img th:if="${achievement.imageUrl}" th:src="@{${achievement.imageUrl}}" class="w-full h-48 object-cover" alt="Achievement image"
                         onerror="this.onerror=null; this.parentElement.innerHTML='<span class=&quot;text-4xl&quot;>🏆</span>';">
                    <span th:unless="${achievement.imageUrl}" class="text-4xl">🏆</span>
                </div>
                <div class="px-6 py-5">
                    <div class="font-bold text-xl mb-2 text-[#1B4332]" th:text="${achievement.title}"></div>
                    <p class="text-gray-600 text-sm leading-relaxed" th:text="${achievement.description}"></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-sm text-[#1B4332] py-8">
        <a href="/" class="text-[#1B4332] hover:underline font-semibold">&larr; Back to Home</a>
        <p class="mt-3">&copy; 2026 SPROUT. All rights reserved.</p>
    </footer>
</body>
</html>
