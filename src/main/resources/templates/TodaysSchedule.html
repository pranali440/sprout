<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Cane Bookings - SPROUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#D8F3DC] min-h-screen">
    <!-- Header -->
    <header class="bg-[#1B4332] text-white py-8 shadow-md relative">
        <a href="javascript:history.back()" class="absolute left-4 top-1/2 -translate-y-1/2 text-[#95D5B2] hover:text-white text-sm font-semibold">&larr; Back</a>
        <div class="container mx-auto text-center px-4">
            <span class="text-2xl font-extrabold tracking-wide">SPROUT</span>
            <h1 class="text-2xl font-bold mt-2">Today's Cane Bookings</h1>
        </div>
    </header>

    <main class="container mx-auto py-10 px-4">
        <div class="bg-white rounded-2xl shadow-md p-8">

            <div th:if="${message}" class="mb-6 bg-green-100 text-green-700 text-sm font-semibold py-3 px-4 rounded-lg" th:text="${message}"></div>

            <div th:if="${#lists.isEmpty(schedules)}" class="text-center py-10 text-gray-500">
                No cane bookings scheduled for today.
            </div>

            <div th:unless="${#lists.isEmpty(schedules)}" class="overflow-x-auto mb-6">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-[#1B4332] text-white text-sm">
                            <th class="px-4 py-3 rounded-l-lg font-semibold">Sr. No</th>
                            <th class="px-4 py-3 font-semibold">Farmer ID</th>
                            <th class="px-4 py-3 font-semibold">Farmer Name</th>
                            <th class="px-4 py-3 font-semibold">Booking Time</th>
                            <th class="px-4 py-3 font-semibold">Booking Date</th>
                            <th class="px-4 py-3 font-semibold">Location</th>
                            <th class="px-4 py-3 rounded-r-lg font-semibold">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm text-gray-700">
                        <tr th:each="schedule : ${schedules}" class="hover:bg-[#D8F3DC]/40 transition">
                            <td class="px-4 py-3" th:text="${schedule.scheduleId}"></td>
                            <td class="px-4 py-3" th:text="${schedule.farmer.farmerId}"></td>
                            <td class="px-4 py-3" th:text="${schedule.farmer.name}"></td>
                            <td class="px-4 py-3" th:text="${schedule.bookingTime}"></td>
                            <td class="px-4 py-3" th:text="${#temporals.format(schedule.bookingDate,'dd-MM-yyyy')}"></td>
                            <td class="px-4 py-3" th:text="${schedule.location}"></td>
                            <td class="px-4 py-3">
                                <span th:if="${schedule.status == 'completed'}" class="inline-block bg-green-100 text-green-700 text-xs font-semibold py-1 px-3 rounded-full">✓ Completed</span>
                                <span th:unless="${schedule.status == 'completed'}" class="inline-block bg-red-100 text-red-700 text-xs font-semibold py-1 px-3 rounded-full" th:text="${schedule.status}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <form action="/schedule/schedule" method="post">
                <button type="submit" class="bg-[#1B4332] hover:bg-[#2d6a4f] text-white font-semibold py-2.5 px-6 rounded-lg shadow-md transition">Schedule</button>
            </form>
        </div>
    </main>

    <footer class="text-center text-sm text-[#1B4332] py-8">
        &copy; 2026 SPROUT. All rights reserved.
    </footer>
</body>
</html>
