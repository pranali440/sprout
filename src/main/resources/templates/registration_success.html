<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Success - SPROUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#D8F3DC]">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden p-10 text-center">
            <div class="w-14 h-14 mx-auto rounded-full bg-[#D8F3DC] flex items-center justify-center text-2xl mb-4">✅</div>
            <h2 class="text-2xl font-bold text-[#1B4332] mb-2">Registration Successful!</h2>
            <p class="text-sm text-gray-500 mb-6">Thank you for registering with SPROUT.</p>

            <div class="bg-[#D8F3DC] rounded-lg px-4 py-3 mb-6">
                <p class="text-xs text-gray-600">Your Farmer Reference ID</p>
                <p class="text-xl font-bold text-[#1B4332]" th:text="${farmerId}"></p>
                <p class="text-xs text-gray-500 mt-1">Keep this for your records — you'll log in with your email, not this ID.</p>
            </div>

            <a href="/farmerLogin" class="inline-block w-full bg-[#1B4332] hover:bg-[#2d6a4f] text-white font-bold py-3 rounded-lg transition">Go to Login</a>
        </div>
    </div>
</body>
</html>
