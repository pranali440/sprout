spring.application.name=app


# Reads from environment variables in production; falls back to local profile values for dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sproute_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Most hosting platforms assign the port via $PORT; defaults to 8080 locally
server.port=${PORT:8080}

# Root admin bootstrap account - used only to log in and create other admins.
# Real values come from ROOT_ADMIN_USERNAME / ROOT_ADMIN_PASSWORD env vars or application-local.properties
root.admin.username=${ROOT_ADMIN_USERNAME:}
root.admin.password=${ROOT_ADMIN_PASSWORD:}

spring.profiles.active=local